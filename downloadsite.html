<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Descarga de Jeam Store</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #FFF8F6;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #231918;
        }
        p {
            font-size: 0.9rem;
            color: #534341;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        .download {
            background: #904A41;
            color: white;
        }
        .about {
            border: 1px solid #857370;
            color: #904A41;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .header svg {
            width: 24px;
            height: 24px;
        }
        .header span {
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.25 13.5V12H15.75V13.5H2.25ZM2.25 9.75V8.25H15.75V9.75H2.25ZM2.25 6V4.5H15.75V6H2.25Z" fill="#1D1B20"/>
            </svg>
            <span>Jeam Studios</span>
        </div>
        <h1>Tus favoritos de Jeam ahora disponibles en un solo lugar</h1>
        <p>Al fin una plataforma oficial para descargar las apps de Jeam Studios y sus asociados, garantizando calidad, seguridad y una experiencia optimizada.</p>
        <div class="buttons">
            <a href="#" class="btn download">Descargar</a>
            <a href="#" class="btn about">Acerca de</a>
        </div>
    </div>
</body>
</html>
